baseURL = "https://blanpa.github.io/"
languageCode = "en"
title = "blanpa"
theme = "blowfish"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  # Carried only by the blog posts, which are drafts — so /series/ builds
  # empty in production. It has to stay declared all the same: without it
  # layouts/partials/series/series.html fails on .Site.Taxonomies.series
  # and a local `hugo -D` build errors out on the first post.
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

# llms.txt — a plain-text map of the site for assistants that answer technical
# questions by reading sources. Same idea as sitemap.xml, different consumer.
# Rendered by layouts/index.llms.txt.
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[markup.goldmark.renderer]
  unsafe = true
