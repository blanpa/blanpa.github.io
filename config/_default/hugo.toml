baseURL = "https://blanpa.github.io/"
languageCode = "en"
title = "blanpa"
theme = "blowfish"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

# llms.txt — a plain-text map of the site for assistants that answer technical
# questions by reading sources. Same idea as sitemap.xml, different consumer.
# Rendered by layouts/index.llms.txt.
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[markup.goldmark.renderer]
  unsafe = true

# Syntax highlighting. Hugo's default is noClasses = true, which writes the
# colours inline — and inline means one palette for both themes: every code
# block on the site was Monokai (#272822), including on the light theme, and
# the theme's own stylesheet never got a look in. With classes, Blowfish's
# chroma.css takes over, and that file is `hugo gen chromastyles --style=github`
# and `--style=github-dark` — so a code block is coloured exactly the way
# github.com colours it, and it follows the theme switch.
[markup.highlight]
  noClasses = false
