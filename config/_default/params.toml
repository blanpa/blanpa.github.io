# assets/css/schemes/graphite.css — graphite greys and a signal amber, so
# the theme's own furniture matches the site's.
colorScheme = "graphite"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
# defaultSocialImage intentionally unset: extend-head-uncached.html supplies
# og:image (rich default on home, generated title cards on image-less pages).
mainSections = ["blog"]
# Formspree form id used by the contact-form / contact-modal shortcodes.
formspreeId = "myegapwn"
disableImageOptimization = false
# Blowfish attaches medium-zoom to every img without .nozoom. The site has no
# in-article illustrations, only covers, so every cover was click-to-enlarge.
# The switch needs the forked layouts/partials/footer.html to have any effect.
disableImageZoom = true
highlightCurrentMenuArea = true
# Cookieless analytics: create an account at goatcounter.com, then set your
# site code here (e.g. "blanpa") to enable the tracker in extend-head.html.
# goatcounter = ""
smartTOC = true

[header]
  # GitHub's header is a solid bar with a hairline under it, present from the
  # first pixel of scroll. "fixed-fill-blur" instead fades a backdrop-blur in
  # as you scroll, which is the one piece of chrome Primer has no equivalent
  # for — and it needs JS on every scroll event to do it.
  layout = "fixed-fill"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # "custom" renders layouts/partials/home/custom.html — a two-column hero
  # (copy and actions left, portrait right) instead of Blowfish's centred
  # identity card.
  layout = "custom"
  homepageImage = ""
  showRecent = true
  showRecentItems = 5

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = false
  showHero = true
  # "background" washes the cover across the full width behind the title, and
  # the date, tag row and series bar end up on top of the artwork. The covers
  # are schematics drawn on paper, so under light type on the dark theme the
  # whole page header became a grey band. Projects had already been moved off
  # it for the same reason; this is the default for every article now, and
  # both sections say so explicitly in their cascade.
  heroStyle = "basic"
  layoutBackgroundBlur = true
  # false: with a blurred background hero the image is dimmed to almost
  # nothing, so the reserved header space was 337px of empty grid above every
  # article title — a third of a laptop screen, and it read as a layout bug.
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showComments = true
  showTaxonomies = true
  showWordCount = false
  showZenMode = false
  sharingLinks = ["linkedin", "reddit"]

[list]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = true
  showCards = true
  orderByWeight = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false

[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  cardView = false

[term]
  showHero = true
  heroStyle = "background"
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false

[author]
  name = "blanpa"
  image = "img/author.png"
  headline = "IIoT Software Developer — from PLC to cloud"
  bio = "Building industrial connectivity solutions with Node-RED, OPC-UA, NATS, and edge computing."
  links = [
    { github = "https://github.com/blanpa" },
    { linkedin = "https://linkedin.com/in/blanpa" },
    { medium = "https://medium.com/@blanpa" },
    { ko-fi = "https://ko-fi.com/blanpa" },
    { heart-empty = "https://github.com/sponsors/blanpa" },
  ]
