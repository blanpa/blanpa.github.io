name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so future-dated (scheduled) posts publish on their date.
  # Hugo excludes future-dated content from the build until that date arrives.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Bake the live npm download numbers into the build (data/npm_stats.yml).
      # The daily cron keeps them fresh. A package the API won't answer for
      # keeps its last known count instead of discarding the whole refresh —
      # one flaky request used to cost every package its update and left the
      # site showing whatever was committed months ago.
      - name: Refresh npm download stats
        run: |
          set -euo pipefail

          last_known() {
            sed -n "s/^  $1: \([0-9]\+\)$/\1/p" data/npm_stats.yml | head -1
          }

          total=0
          rows=""
          fresh=0
          stale=0
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            dl=$(curl -sf --max-time 20 "https://api.npmjs.org/downloads/point/last-month/${pkg}" \
              | grep -oP '(?<="downloads":)\d+' || true)
            if [ -n "$dl" ]; then
              fresh=$((fresh + 1))
            else
              dl=$(last_known "$pkg")
              stale=$((stale + 1))
              echo "::warning::npm API did not answer for ${pkg} — keeping last known value (${dl:-0})"
            fi
            dl=${dl:-0}
            total=$((total + dl))
            rows="${rows}  ${pkg}: ${dl}"$'\n'
          done < <(sed -n 's/^- pkg: //p' data/npm_packages.yml)

          # Nothing was actually refreshed: leave the file alone rather than
          # stamping today's date onto numbers that are all carried over — the
          # site would then claim month-old counts are current.
          if [ "$fresh" -eq 0 ] || [ "$total" -le 0 ]; then
            echo "::warning::npm API unreachable — keeping the committed file unchanged"
            exit 0
          fi

          {
            echo "# Generated by the deploy workflow — do not edit by hand."
            echo "total_last_month: ${total}"
            echo "updated: $(date -u +%F)"
            echo "packages:"
            printf '%s' "$rows"
          } > data/npm_stats.yml

          echo "npm total (last month): ${total} — ${stale} package(s) carried over"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo \
            --minify \
            --gc \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
