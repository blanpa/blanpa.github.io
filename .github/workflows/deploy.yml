name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so future-dated (scheduled) posts publish on their date.
  # Hugo excludes future-dated content from the build until that date arrives.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Bake the live npm download total into the build (data/npm_stats.yml).
      # The daily cron keeps it fresh; on API failure the committed baseline
      # in the repo stays in place, so the site never shows a broken number.
      - name: Refresh npm download stats
        run: |
          total=0
          ok=true
          per_pkg=""
          for pkg in $(grep -oP '(?<=- pkg: ).*' data/npm_packages.yml); do
            dl=$(curl -sf --max-time 20 "https://api.npmjs.org/downloads/point/last-month/${pkg}" \
              | grep -oP '(?<="downloads":)\d+' || true)
            if [ -z "$dl" ]; then ok=false; break; fi
            total=$((total + dl))
            per_pkg="${per_pkg}  ${pkg}: ${dl}"$'\n'
          done
          if [ "$ok" = true ] && [ "$total" -gt 0 ]; then
            {
              echo "# Generated by the deploy workflow — do not edit by hand."
              echo "total_last_month: ${total}"
              echo "updated: $(date -u +%F)"
              echo "packages:"
              printf '%s' "$per_pkg"
            } > data/npm_stats.yml
            echo "npm total (last month): ${total}"
          else
            echo "npm API unavailable — keeping committed baseline"
          fi

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo \
            --minify \
            --gc \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
