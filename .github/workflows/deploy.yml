name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so future-dated (scheduled) posts publish on their date.
  # Hugo excludes future-dated content from the build until that date arrives.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Bake the live npm numbers into the build (data/npm_stats.yml): monthly
      # downloads plus the latest published version and its date, which is what
      # tells a visitor whether a package is still maintained.
      #
      # A package the registry will not answer for keeps its last known values
      # rather than discarding the whole refresh, and the file is only rewritten
      # if at least one package came back fresh — otherwise today's date would
      # be stamped onto figures that are all carried over.
      - name: Refresh npm download stats
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, re, sys, urllib.request, datetime

          def get(url, timeout=20):
              try:
                  with urllib.request.urlopen(url, timeout=timeout) as r:
                      return json.load(r)
              except Exception as exc:
                  print(f"::warning::{url} failed: {exc}")
                  return None

          pkgs = re.findall(r"^- pkg: (.+)$", open("data/npm_packages.yml").read(), re.M)
          old = open("data/npm_stats.yml").read()

          def previous(section, pkg, field=None):
              """Last known value from the committed file, so one bad request
              costs one number rather than the whole table."""
              if field:
                  m = re.search(rf"^  {re.escape(pkg)}:\n(?:    .*\n)*?    {field}: (.+)$", old, re.M)
              else:
                  m = re.search(rf"^  {re.escape(pkg)}: (\d+)$", old, re.M)
              return m.group(1).strip() if m else None

          total, fresh, stale = 0, 0, 0
          downloads, versions = {}, {}

          for pkg in pkgs:
              d = get(f"https://api.npmjs.org/downloads/point/last-month/{pkg}")
              if d and isinstance(d.get("downloads"), int):
                  downloads[pkg] = d["downloads"]
                  fresh += 1
              else:
                  downloads[pkg] = int(previous(None, pkg) or 0)
                  stale += 1
              total += downloads[pkg]

              meta = get(f"https://registry.npmjs.org/{pkg}")
              if meta:
                  latest = meta.get("dist-tags", {}).get("latest")
                  released = (meta.get("time", {}).get(latest) or "")[:10]
                  if latest:
                      versions[pkg] = (latest, released)
              if pkg not in versions:
                  v = previous("versions", pkg, "version")
                  r = previous("versions", pkg, "released")
                  if v:
                      versions[pkg] = (v, r or "")

          if fresh == 0 or total <= 0:
              print("::warning::npm registry unreachable — keeping the committed file unchanged")
              sys.exit(0)

          out = ["# Generated by the deploy workflow — do not edit by hand.",
                 f"total_last_month: {total}",
                 f"updated: {datetime.date.today().isoformat()}",
                 "packages:"]
          out += [f"  {p}: {downloads[p]}" for p in pkgs]
          out.append("versions:")
          for p in pkgs:
              if p in versions:
                  v, r = versions[p]
                  out.append(f"  {p}:")
                  out.append(f"    version: \"{v}\"")
                  if r:
                      out.append(f"    released: \"{r}\"")
          open("data/npm_stats.yml", "w").write("\n".join(out) + "\n")
          print(f"npm total (last month): {total} — {stale} package(s) carried over")
          PYEOF

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo \
            --minify \
            --gc \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
