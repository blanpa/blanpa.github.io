name: CI

# Everything that must hold before main is allowed to change. deploy.yml is
# the only workflow that publishes; this one only ever says yes or no.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  content:
    name: Content tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Checks the articles themselves: front matter, code samples, internal
      # links, and the technical claims in the prose. See tests/README.md.
      - name: Run content tests
        run: python -m pytest

  diagrams:
    name: Mermaid diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Its own job: mermaid-cli renders each diagram in a headless browser,
      # which takes minutes, and a broken diagram shows up as an error box on
      # the page rather than as a build failure.
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Validate every diagram
        run: python -m pytest tests/test_links_and_diagrams.py -k mermaid

  build:
    name: Build & check
    runs-on: ubuntu-latest
    env:
      # Keep in sync with deploy.yml and docker-compose.yml.
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo --minify --gc --printPathWarnings --baseURL "https://blanpa.github.io/"

      - name: Check rendered output
        run: |
          set -euo pipefail
          fail=0

          # A ```mermaid fence that reaches the browser unrendered means the
          # codeblock render hook stopped matching — the diagram then shows up
          # as its own source code. This is exactly how 11 diagrams silently
          # broke once already.
          if grep -rl "language-mermaid" public --include="*.html" >/dev/null 2>&1; then
            echo "::error::unrendered ```mermaid fences in:"
            grep -rl "language-mermaid" public --include="*.html"
            fail=1
          fi

          # Shortcodes that were never expanded (typo in the name, missing
          # template) are printed verbatim into the page.
          if grep -rn "{{[<%]" public --include="*.html" >/dev/null 2>&1; then
            echo "::error::unexpanded shortcode delimiters in the output:"
            grep -rn "{{[<%]" public --include="*.html" | head -20
            fail=1
          fi

          exit $fail

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links only: external hosts rate-limit and go down, which
          # would make this check a coin flip. --offline resolves every link
          # against the built site, so a renamed page fails the PR that
          # renamed it.
          #
          # Fragment checking (--include-fragments) is deliberately off: the
          # theme's skip link and back-to-top link are bare "#main-content" /
          # "#the-top" hrefs, which lychee resolves against --base-url instead
          # of the containing page — 1858 false failures on this site.
          args: >-
            --offline
            --base-url public
            --no-progress
            public/**/*.html
          fail: true
