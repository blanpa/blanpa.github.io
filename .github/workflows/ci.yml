name: CI

# Everything that must hold before main is allowed to change. deploy.yml is
# the only workflow that publishes; this one only ever says yes or no.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The content test suite deliberately does NOT run here — it runs locally,
# before the commit, via the pre-commit hook in .githooks/ (see tests/README.md).
# This workflow only checks what needs a real Hugo build.

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    env:
      # Keep in sync with deploy.yml and docker-compose.yml.
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo --minify --gc --printPathWarnings --baseURL "https://blanpa.github.io/"

      - name: Check rendered output
        run: |
          set -euo pipefail
          fail=0

          # A mermaid fence that reaches the browser unrendered means the
          # codeblock render hook stopped matching — the diagram then shows up
          # as its own source code. This is exactly how 11 diagrams silently
          # broke once already.
          #
          # Note: single quotes below. A backtick inside a double-quoted string
          # opens a command substitution, which is how this step first shipped
          # broken.
          if grep -rl 'language-mermaid' public --include='*.html' >/dev/null 2>&1; then
            echo '::error::unrendered mermaid fences in:'
            grep -rl 'language-mermaid' public --include='*.html'
            fail=1
          fi

          # Shortcodes that were never expanded (typo in the name, missing
          # template) are printed verbatim into the page.
          if grep -rnF -e '{{<' -e '{{%' public --include='*.html' >/dev/null 2>&1; then
            echo '::error::unexpanded shortcode delimiters in the output:'
            grep -rnF -e '{{<' -e '{{%' public --include='*.html' | head -20
            fail=1
          fi

          exit $fail

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links only: external hosts rate-limit and go down, which
          # would make this check a coin flip. --offline resolves every link
          # against the built site, so a renamed page fails the PR that
          # renamed it.
          #
          # Fragment checking (--include-fragments) is deliberately off: the
          # theme's skip link and back-to-top link are bare "#main-content" /
          # "#the-top" hrefs, which lychee resolves against --base-url instead
          # of the containing page — 1858 false failures on this site.
          # --root-dir, not --base-url: base-url wants a full URL or an
          # absolute path, and is not what resolves root-relative hrefs in
          # local files. It must be absolute, hence github.workspace.
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/public
            --no-progress
            public/**/*.html
          fail: true
