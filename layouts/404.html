{{ define "main" }}
<div class="error-404">
  <div class="error-404__content glass">
    <span class="error-404__code">404</span>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="error-404__actions">
      <a href="/" class="error-404__btn error-404__btn--primary">Back to Home</a>
      <a href="/blog/" class="error-404__btn">Read the Blog</a>
    </div>
  </div>
</div>

<style>
/* Styled off the tokens, so it followed the site onto Primer with them. The
   two controls are Primer's pair: a green primary and a default button, both
   6px, neither of which moves on hover. */
.error-404 {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 50vh;
  padding: 2rem;
}
.error-404__content {
  text-align: center;
  padding: 3rem 4rem;
  max-width: 500px;
}
.error-404__code {
  display: block;
  font-family: var(--font-sans);
  font-size: 5rem;
  font-weight: 600;
  line-height: 1;
  margin-bottom: 0.5rem;
  color: var(--ink-faint);
}
.error-404__content h1 {
  font-size: var(--text-2xl);
  margin: 0 0 0.75rem 0;
}
.error-404__content p {
  margin: 0 0 2rem;
  color: var(--ink-soft);
  font-size: var(--text-base);
  line-height: 1.6;
}
.error-404__actions {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
}
.error-404__btn {
  display: inline-flex;
  align-items: center;
  padding: 0.3rem 1rem;
  min-height: 32px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  font-weight: 500;
  text-decoration: none;
  transition: background-color 0.15s ease;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--fg);
  box-shadow: var(--shadow-sm);
}
.error-404__btn--primary {
  background: var(--btn-primary-bg);
  color: var(--btn-primary-fg);
  border-color: var(--btn-primary-border);
}
@media (hover: hover) {
  .error-404__btn:hover {
    background: var(--btn-hover-bg);
  }
  .error-404__btn--primary:hover {
    background: var(--btn-primary-hover-bg);
  }
}
@media (max-width: 500px) {
  .error-404__content { padding: 2rem 1.5rem; }
  .error-404__code { font-size: 3.5rem; }
  .error-404__actions { flex-direction: column; }
}
</style>
{{ end }}
