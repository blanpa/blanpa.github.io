{{ define "main" }}
<div class="error-404">
  <div class="error-404__content glass">
    <span class="error-404__code">404</span>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="error-404__actions">
      <a href="/" class="error-404__btn error-404__btn--primary">Back to Home</a>
      <a href="/blog/" class="error-404__btn">Read the Blog</a>
    </div>
  </div>
</div>

<style>
/* This page never got the ink-and-paper pass: it still had the mint-to-blue
   gradient on the numerals and the primary button, mint hover tints, weight
   900 and a lift-on-hover — the whole vocabulary the redesign removed
   everywhere else. It is styled off the tokens now, and the buttons are the
   same two the About hero uses. */
.error-404 {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 50vh;
  padding: 2rem;
}
.error-404__content {
  text-align: center;
  padding: 3rem 4rem;
  max-width: 500px;
}
.error-404__code {
  display: block;
  font-family: var(--font-display);
  font-size: 5rem;
  font-weight: 600;
  line-height: 1;
  margin-bottom: 0.5rem;
  color: var(--ink-faint);
}
.error-404__content h1 {
  font-size: var(--text-2xl);
  margin: 0 0 0.75rem 0;
}
.error-404__content p {
  margin: 0 0 2rem;
  color: var(--ink-soft);
  font-size: var(--text-base);
  line-height: 1.6;
}
.error-404__actions {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
}
.error-404__btn {
  display: inline-flex;
  align-items: center;
  padding: 0.5rem 1.15rem;
  border-radius: 9999px;
  font-size: 0.85rem;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease;
  border: 1px solid rgb(var(--accent-rgb) / 0.4);
  color: var(--accent);
}
.error-404__btn--primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
@media (hover: hover) {
  .error-404__btn:hover {
    background: rgb(var(--accent-rgb) / 0.12);
    transform: translateY(-1px);
  }
  .error-404__btn--primary:hover {
    background: var(--accent);
    filter: brightness(1.08);
    transform: translateY(-1px);
  }
}
@media (max-width: 500px) {
  .error-404__content { padding: 2rem 1.5rem; }
  .error-404__code { font-size: 3.5rem; }
  .error-404__actions { flex-direction: column; }
}
</style>
{{ end }}
